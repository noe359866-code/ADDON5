services:
  # Addon de streams de Gnula. Sin dependencias: `npm ci` solo valida el
  # lockfile y el arranque es inmediato (Render Free duerme el servicio).
  - type: web
    name: addon5-gnula
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # auto  → el proxy solo se usa cuando el CDN exige Referer (lo normal)
      # always → proxy para todo; never → URL directa + proxyHeaders
      - key: STREAM_PROXY
        value: auto
      # Stremio abandona las peticiones lentas: presupuesto total y por petición.
      - key: HANDLER_DEADLINE_MS
        value: "15000"
      - key: FETCH_TIMEOUT_MS
        value: "7000"
      # Opcional: dominio público si no se detecta solo (RENDER_EXTERNAL_URL).
      # - key: PUBLIC_BASE_URL
      #   sync: false
