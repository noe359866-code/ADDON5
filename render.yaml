# Blueprint de Render: sitio estático gratuito (sin servidor, sin base de datos).
# Dashboard de Render → New → Blueprint → conecta el repo → elige la rama de abajo → Apply.
#
# Tras la fusión en main, el Blueprint despliega desde main. Si prefieres
# desplegar desde otra rama, cambia el valor de `branch`.
services:
  - type: web
    name: hitzbidaia
    runtime: static
    branch: main
    # --include=dev es importante: vite y typescript están en devDependencies
    # y Render construye con NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      # Fallback para SPA (la app no usa rutas, pero evita 404 en recargas).
      - type: rewrite
        source: /*
        destination: /index.html
