services:
  - type: web
    name: addon5-hls
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STREAM_TOKEN_SECRET
        generateValue: true
      - key: HLS_ALLOWED_HOSTS
        sync: false
      - key: CATALOG_JSON
        sync: false
      - key: STREAMS_JSON
        sync: false

  # Addon de subtítulos (subproyecto en subtitles-addon/).
  # Si creas el Web Service manualmente en el dashboard, estos son los
  # mismos valores que debes introducir (Root Directory, build y start).
  # OJO: no declares PORT aquí; Render lo inyecta automáticamente.
  - type: web
    name: addon5-subtitles
    runtime: node
    plan: free
    rootDir: subtitles-addon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SUBTITLE_LANGUAGES
        value: ES,EN
      - key: SUBTITLE_LANGUAGES_ONLY
        value: "false"
      # Firma ESTABLE de los enlaces de descarga /sub/{token}.srt.
      # Sin esto se genera una nueva en cada arranque y los subtítulos que
      # Stremio tenía cargados dejan de funcionar tras un reinicio.
      - key: SUBTITLE_TOKEN_SECRET
        generateValue: true
      # Presupuesto de respuesta: Stremio abandona las peticiones lentas.
      - key: HANDLER_DEADLINE_MS
        value: "9000"
      - key: PROVIDER_TIMEOUT_MS
        value: "5000"
      # Opcionales: solo como respaldo si el scraping web no devuelve nada.
      - key: SUBDL_API_KEY
        sync: false
      - key: SUBSOURCE_API_KEY
        sync: false
