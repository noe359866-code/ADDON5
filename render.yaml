# Blueprint de Render: sitio estático gratuito (sin servidor, sin base de datos).
# Dashboard de Render → New → Blueprint → conecta el repo → elige la rama de abajo → Apply.
#
# OJO: la rama `main` todavía contiene el repo antiguo. Si fusionas esta rama
# en main, cambia `branch` a `main` antes de desplegar.
services:
  - type: web
    name: hitzbidaia
    runtime: static
    branch: arena/691833fa-addon5
    # --include=dev es importante: vite y typescript están en devDependencies
    # y Render construye con NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Fallback para SPA (la app no usa rutas, pero evita 404 en recargas).
      - type: rewrite
        source: /*
        destination: /index.html
