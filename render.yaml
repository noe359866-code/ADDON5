services:
  # Addon de streams de Gnula + GnulaHD. Sin dependencias: `npm ci` solo
  # valida el lockfile y el arranque es inmediato (Render Free duerme el
  # servicio).
  - type: web
    name: addon5-gnula
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # auto  → el proxy solo se usa cuando el CDN exige Referer (lo normal)
      # always → proxy para todo; never → URL directa + proxyHeaders
      - key: STREAM_PROXY
        value: auto
      # Solo streams reproducibles: si nada entrega video, lista vacía.
      - key: ALLOW_EXTERNAL_FALLBACK
        value: "false"
      # true → descarta los MP4 y deja solo listas HLS.
      - key: ONLY_HLS
        value: "false"
      # Opcional: con clave, los títulos se buscan también en español (TMDB).
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_LANGUAGE
        value: es-MX
      # Stremio abandona las peticiones lentas: presupuesto total y por petición.
      - key: HANDLER_DEADLINE_MS
        value: "15000"
      - key: FETCH_TIMEOUT_MS
        value: "7000"
      # Opcional: dominio público si no se detecta solo (RENDER_EXTERNAL_URL).
      # - key: PUBLIC_BASE_URL
      #   sync: false
