services:
  # Addon de streams de Gnula + GnulaHD. Sin dependencias: `npm ci` solo
  # valida el lockfile y el arranque es inmediato (Render Free duerme el
  # servicio).
  - type: web
    name: addon5-gnula
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # auto  → el proxy solo se usa cuando el CDN exige Referer (lo normal)
      # always → proxy para todo; never → URL directa + proxyHeaders
      - key: STREAM_PROXY
        value: auto
      # Solo se entregan enlaces que Stremio reproduce (HLS y MP4).
      # Añade mkv si lo vas a ver en escritorio/TV.
      - key: STREMIO_FORMATS
        value: hls,mp4
      # Opcional pero recomendado: con clave, el título en español (es-MX) lo
      # pone TMDB y se aceptan IDs `tmdb:…`. Sin clave se usa Wikidata +
      # Wikipedia, que también dan el título latino.
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_LANGUAGE
        value: es-MX
      # Stremio abandona las peticiones lentas: presupuesto total y por petición.
      # Las webs tardan: GnulaHD ha llegado a responder en 12-25 s. Con un
      # presupuesto corto la respuesta sale vacía.
      - key: HANDLER_DEADLINE_MS
        value: "20000"
      - key: FETCH_TIMEOUT_MS
        value: "12000"
      # Opcional: dominio público si no se detecta solo (RENDER_EXTERNAL_URL).
      # - key: PUBLIC_BASE_URL
      #   sync: false
