name: tests
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
jobs:
  subtitles-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check subtitles-addon/index.js
      - run: npm test
